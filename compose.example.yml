name: ${PROJECT_ID}

services:
  backend:
    image: ${PROJECT_ID}-backend:${RELEASE_TAG:-local}
    build:
      context: ./backend
    restart: unless-stopped
    user: '${PUID:-1000}:${PGID:-1000}'
    ports:
      - '127.0.0.1:${BACKEND_PORT}:8080'
    environment:
      PB_ENCRYPTION_KEY: ${PB_ENCRYPTION_KEY}
      PB_SUPERUSER_EMAIL: ${PB_SUPERUSER_EMAIL}
      PB_SUPERUSER_PASSWORD: ${PB_SUPERUSER_PASSWORD}
      PB_REGISTRATION_ENABLED: ${PB_REGISTRATION_ENABLED:-false}
      PB_REQUIRE_EMAIL_VERIFICATION: ${PB_REQUIRE_EMAIL_VERIFICATION:-true}
      PB_GUEST_ENABLED: ${PB_GUEST_ENABLED:-false}
      PB_GUEST_TTL_HOURS: ${PB_GUEST_TTL_HOURS:-24}
      PB_APP_NAME: ${PB_APP_NAME:-}
      PB_APP_URL: ${PB_APP_URL}
      PB_MAIL_SENDER_NAME: ${PB_MAIL_SENDER_NAME:-}
      PB_MAIL_SENDER_ADDRESS: ${PB_MAIL_SENDER_ADDRESS:-}
      PB_SMTP_HOST: ${PB_SMTP_HOST:-}
      PB_SMTP_PORT: ${PB_SMTP_PORT:-587}
      PB_SMTP_USERNAME: ${PB_SMTP_USERNAME:-}
      PB_SMTP_PASSWORD: ${PB_SMTP_PASSWORD:-}
      PB_SMTP_TLS: ${PB_SMTP_TLS:-}
      PB_SMTP_AUTH_METHOD: ${PB_SMTP_AUTH_METHOD:-PLAIN}
      PB_TRUSTED_PROXY_HEADERS: ${PB_TRUSTED_PROXY_HEADERS:-X-Forwarded-For}
    volumes:
      - ./.runtime/pb_data:/pb/pb_data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:8080/api/v1/health']
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'
